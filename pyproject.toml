[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equivalence-search"
version = "0.1.0"
description = "Equivalence-Class Search for Neuro-Symbolic Reasoning under Ambiguous Supervision"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
equivalence-search = "equivalence_search.cli:main"

[tool.setuptools.packages.find]
include = ["equivalence_search*"]
